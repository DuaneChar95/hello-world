name: Fetch card images

# The session that writes the draft guide cannot reach any image host, so the
# card art is fetched here, packed into sprite sheets, and committed back to
# the branch. Sprite sheets keep the published page under its 255-file limit.

on:
  workflow_dispatch:
  push:
    paths:
      - 'reality-fracture/tools/fetch_card_images.py'
      - '.github/workflows/fetch-card-images.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow and requests
        run: python -m pip install --upgrade pip pillow requests

      - name: Download and pack the card images
        run: python reality-fracture/tools/fetch_card_images.py

      - name: Show what was produced
        run: ls -la reality-fracture/card-images

      - name: Commit the sprite sheets back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reality-fracture/card-images
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Add card image sprite sheets fetched by CI [skip ci]"
            git push
          fi
