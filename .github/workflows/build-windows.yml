name: Build Windows app

# Builds MTGA Coach into a real Windows executable and uploads it as a
# downloadable artifact. PyInstaller cannot cross-compile, so this has to run
# on a Windows runner.

on:
  workflow_dispatch:
  push:
    paths:
      - 'mtga-coach/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mtga-coach

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check tkinter is present
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Generate the icon
        run: python assets/make_icon.py

      - name: Self-test before packaging
        run: python run_overlay.py --selftest

      - name: Check Tk widget options
        run: python tools_check_tk.py

      - name: Drive the windows against a strict Tk stub
        run: python tools_smoke_gui.py

      - name: Build
        run: python -m PyInstaller mtga-coach.spec --noconfirm --clean

      - name: Smoke-test the packaged console build
        run: |
          & ".\dist\MTGA Coach (console).exe" --selftest
          if ($LASTEXITCODE -ne 0) { throw "packaged selftest failed" }

      - name: Show what was built
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Package for release
        run: Compress-Archive -Path dist\* -DestinationPath MTGA-Coach-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MTGA-Coach-Windows
          path: mtga-coach/dist/*
          if-no-files-found: error
          retention-days: 90

      # A release gives a plain download link that needs no GitHub login and
      # does not expire, unlike a workflow artifact.
      - name: Publish to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mtga-coach-latest --yes --cleanup-tag 2>$null
          gh release create mtga-coach-latest "MTGA-Coach-Windows.zip" --title "MTGA Coach - Windows (latest)" --notes-file RELEASE_NOTES.md --target $env:GITHUB_SHA
